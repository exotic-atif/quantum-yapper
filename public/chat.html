<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Quantum Yapper - Real-time chat room">
    <meta name="theme-color" content="#0a0e1a">
    <title>Quantum Yapper — Chat</title>
    <link rel="icon" href="./img/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/gpt.css">
</head>
<body>
    <div class="chat">
        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="chat__sidebar"></aside>

        <!-- Main Chat -->
        <main class="chat__main">
            <!-- Mobile Header -->
            <div class="chat__header">
                <button class="chat__header-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="chat__header-info">
                    <div class="chat__header-room" id="header-room">Room</div>
                    <div class="chat__header-users" id="header-users">0 online</div>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages" class="chat__messages"></div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span id="typing-text">Someone is typing...</span>
            </div>

            <!-- Scroll FAB -->
            <button class="scroll-fab" id="scroll-fab" aria-label="Scroll to bottom">
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <!-- Compose -->
            <div class="compose">
                <form id="message-form">
                    <textarea id="message-input" name="message" placeholder="Type a message..." rows="1" maxlength="2000" autocomplete="off"></textarea>
                    <button type="submit" class="compose-btn compose-btn--send" id="send-btn" aria-label="Send message">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
                <button id="send-location" class="compose-btn compose-btn--loc" aria-label="Share location">
                    <i class="fa-solid fa-location-dot"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Templates -->
    <template id="message-template">
        <div class="message">
            <div class="message__bubble">
                <span class="message__name"></span>
                <div class="message__text"></div>
                <div class="message__meta"></div>
            </div>
        </div>
    </template>

    <template id="sidebar-template">
        <div class="sidebar-room-header">
            <div class="room-title">Room <span class="room-name"></span></div>
        </div>
        <h3 class="list-title">Online</h3>
        <ul class="users"></ul>
        <button class="sidebar-leave-btn" id="leave-room-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Leave Room
        </button>
    </template>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>
    <script defer src="/socket.io/socket.io.js"></script>
    <script defer src="./js/chat.js"></script>
</body>
</html>
